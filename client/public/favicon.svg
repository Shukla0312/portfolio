<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#grad)" stroke="#1e40af" stroke-width="1"/>
  
  <!-- Bug icon representing QA/Testing -->
  <g fill="white" stroke="white" stroke-width="0.5">
    <!-- Bug body -->
    <ellipse cx="16" cy="14" rx="3" ry="2"/>
    
    <!-- Bug head -->
    <circle cx="16" cy="11" r="1.5"/>
    
    <!-- Antennae -->
    <line x1="14.5" y1="10" x2="13" y2="8" stroke="white" stroke-width="1"/>
    <line x1="17.5" y1="10" x2="19" y2="8" stroke="white" stroke-width="1"/>
    
    <!-- Legs -->
    <line x1="13" y1="14" x2="11" y2="16" stroke="white" stroke-width="1"/>
    <line x1="19" y1="14" x2="21" y2="16" stroke="white" stroke-width="1"/>
    <line x1="13" y1="15" x2="11" y2="17" stroke="white" stroke-width="1"/>
    <line x1="19" y1="15" x2="21" y2="17" stroke="white" stroke-width="1"/>
    
    <!-- Wings -->
    <ellipse cx="13" cy="13" rx="1.5" ry="0.8" fill="rgba(255,255,255,0.7)"/>
    <ellipse cx="19" cy="13" rx="1.5" ry="0.8" fill="rgba(255,255,255,0.7)"/>
  </g>
  
  <!-- RS initials -->
  <text x="16" y="24" font-family="Arial, sans-serif" font-size="6" font-weight="bold" text-anchor="middle" fill="white">RS</text>
</svg> 